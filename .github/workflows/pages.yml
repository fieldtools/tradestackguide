name: Deploy to GitHub Pages
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}  # full history so build.py can date sitemap lastmod from git
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: python3 build.py
      - name: Save previously deployed sitemap
        run: python3 scripts/indexnow_ping.py fetch
        continue-on-error: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: {path: dist, include-hidden-files: true}
      # Pass sitemaps to the deploy job so IndexNow can still ping after the site is live.
      - name: Persist IndexNow state
        run: |
          mkdir -p indexnow-state
          cp dist/sitemap.xml indexnow-state/new_sitemap.xml
          if [ -f /tmp/prev_sitemap.xml ]; then cp /tmp/prev_sitemap.xml indexnow-state/prev_sitemap.xml; fi
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: indexnow-state, path: indexnow-state, if-no-files-found: ignore}
        continue-on-error: true
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: indexnow-state, path: indexnow-state}
        continue-on-error: true
      - name: IndexNow ping
        run: |
          mkdir -p dist
          if [ -f indexnow-state/new_sitemap.xml ]; then cp indexnow-state/new_sitemap.xml dist/sitemap.xml; fi
          if [ -f indexnow-state/prev_sitemap.xml ]; then cp indexnow-state/prev_sitemap.xml /tmp/prev_sitemap.xml; fi
          python3 scripts/indexnow_ping.py ping
        continue-on-error: true
